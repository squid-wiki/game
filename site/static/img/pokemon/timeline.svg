<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 608" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" role="img" aria-label="宝可梦十个世代的时间线：年份、主机、地区、新增数量与主要新机制">
