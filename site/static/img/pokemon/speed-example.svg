<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 864" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<title id="title">同样 50 级，速度为什么不同</title><desc id="desc">三组速度精确计算分别为94、105、167。条形长度按最终能力值等比例绘制。普通喷火龙使用第三世代火红叶绿精灵。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b7f88"/></marker></defs>
<style>.title{font-size:25px;font-weight:700;fill:#173740}.heading{font-size:22px;font-weight:700;fill:#173740}.body{font-size:20px;fill:#294752}.small{font-size:17px;fill:#526b75}.note{font-size:15px;fill:#526b75}.badge{font-size:17px;font-weight:700;fill:#fff}.number{font-size:20px;font-weight:700;fill:#fff}.value{font-size:24px;font-weight:700;fill:#173740}</style>
<rect x="1" y="1" width="718" height="862" rx="12" fill="#f6f9f8" stroke="#d9e3e6"/><text x="28" y="42" class="title" >同样 50 级，速度为什么不同</text><text x="28" y="72" class="small" >以《火红 / 叶绿》的喷火龙为例；其他条件固定</text>
<rect x="24" y="96" width="672" height="158" rx="12" fill="#fff" stroke="#d9e3e6"/><image x="28" y="106" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="178" y="136" class="heading" >喷火龙 · Lv50</text><text x="178" y="174" class="body" >速度种族值 100 · 普通形态</text><text x="178" y="210" class="small" >性格修正在最后一步向下取整。</text><text x="32" y="286" class="heading" >减速性格</text><text x="32" y="316" class="small" >IV 0 · EV 0 · 速度 ×0.9</text><rect x="32" y="331" width="329" height="32" rx="6" fill="#8f7b9f"/><text x="373" y="356" class="value" >94</text><text x="32" y="392" class="small" >⌊(⌊(200 + 0 + 0) × 0.5⌋ + 5) × 0.9⌋ = 94</text><text x="32" y="428" class="heading" >无性格修正</text><text x="32" y="458" class="small" >IV 0 · EV 0 · 速度 ×1</text><rect x="32" y="473" width="367.5" height="32" rx="6" fill="#618fa6"/><text x="411.5" y="498" class="value" >105</text><text x="32" y="534" class="small" >⌊(⌊(200 + 0 + 0) × 0.5⌋ + 5) × 1⌋ = 105</text><text x="32" y="570" class="heading" >胆小性格</text><text x="32" y="600" class="small" >IV 31 · EV 252 · 速度 ×1.1</text><rect x="32" y="615" width="584.5" height="32" rx="6" fill="#5e4a88"/><text x="628.5" y="640" class="value" >167</text><text x="32" y="676" class="small" >⌊(⌊(200 + 31 + 63) × 0.5⌋ + 5) × 1.1⌋ = 167</text><rect x="24" y="728" width="672" height="88" rx="12" fill="#e9f5e8" stroke="#d9e3e6"/><text x="44" y="764" class="body" >胆小：⌊(147 + 5) × 1.1⌋ = 167</text><text x="44" y="795" class="small" >条长按最终速度绘制，避免把近似贡献当成精确加值。</text>
<text x="28" y="844" class="note" >原版像素素材 · 中文攻略标注 · 非游戏截图</text>
</svg>
