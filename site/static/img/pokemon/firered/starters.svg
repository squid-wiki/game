<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1014" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<title id="title">御三家怎么选</title><desc id="desc">妙蛙种子草毒、小火龙火、杰尼龟水。进化等级和开局招式按火红叶绿标注；道馆相性为攻略建议，不代表保证获胜。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b7f88"/></marker></defs>
<style>.title{font-size:25px;font-weight:700;fill:#173740}.heading{font-size:22px;font-weight:700;fill:#173740}.body{font-size:20px;fill:#294752}.small{font-size:17px;fill:#526b75}.note{font-size:15px;fill:#526b75}.badge{font-size:17px;font-weight:700;fill:#fff}.number{font-size:20px;font-weight:700;fill:#fff}.value{font-size:24px;font-weight:700;fill:#173740}</style>
<rect x="1" y="1" width="718" height="1012" rx="12" fill="#f6f9f8" stroke="#d9e3e6"/><text x="28" y="42" class="title" >御三家怎么选</text><text x="28" y="72" class="small" >《火红 / 叶绿》正面精灵 · 普通配色 · 第三世代数据</text>
<rect x="24" y="96" width="672" height="276" rx="12" fill="#e9f5e8" stroke="#d9e3e6"/><image x="30" y="136" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="174" y="132" class="heading" >妙蛙种子</text><rect x="390" y="110" width="70" height="28" rx="5" fill="#609c39"/><text x="425" y="131" class="badge" text-anchor="middle">草</text><rect x="468" y="110" width="70" height="28" rx="5" fill="#a040a0"/><text x="503" y="131" class="badge" text-anchor="middle">毒</text><text x="174" y="172" class="body" >妙蛙种子 → 妙蛙草 → 妙蛙花</text><text x="174" y="202" class="small" >Lv16 进化 / Lv32 进化 · 草 / 毒</text><text x="174" y="236" class="small" >最终形态种族值合计 525</text><path d="M48 261 L672 261" fill="none" stroke="#bacbd0" stroke-width="3" /><text x="48" y="292" class="small" >小刚：有利　小霞：有利　马志士：抗电</text><text x="48" y="324" class="body" >Lv7 寄生种子 · Lv10 藤鞭</text><text x="48" y="352" class="small" >草系招式打小刚的两只宝可梦均为 4 倍。</text><rect x="24" y="388" width="672" height="276" rx="12" fill="#fff0e5" stroke="#d9e3e6"/><image x="30" y="428" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="174" y="424" class="heading" >小火龙</text><rect x="390" y="402" width="70" height="28" rx="5" fill="#cf602d"/><text x="425" y="423" class="badge" text-anchor="middle">火</text><text x="174" y="464" class="body" >小火龙 → 火恐龙 → 喷火龙</text><text x="174" y="494" class="small" >Lv16 进化 / Lv36 进化 · 最终为火 / 飞行</text><text x="174" y="528" class="small" >最终形态种族值合计 534</text><path d="M48 553 L672 553" fill="none" stroke="#bacbd0" stroke-width="3" /><text x="48" y="584" class="small" >小刚：不利　小霞：不利　马志士：中性</text><text x="48" y="616" class="body" >Lv7 火花 · Lv13 金属爪</text><text x="48" y="644" class="small" >打小刚可用金属爪，搭配猴怪更稳。</text><rect x="24" y="680" width="672" height="276" rx="12" fill="#eaf2ff" stroke="#d9e3e6"/><image x="30" y="720" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="174" y="716" class="heading" >杰尼龟</text><rect x="390" y="694" width="70" height="28" rx="5" fill="#537fc8"/><text x="425" y="715" class="badge" text-anchor="middle">水</text><text x="174" y="756" class="body" >杰尼龟 → 卡咪龟 → 水箭龟</text><text x="174" y="786" class="small" >Lv16 进化 / Lv36 进化 · 水</text><text x="174" y="820" class="small" >最终形态种族值合计 530</text><path d="M48 845 L672 845" fill="none" stroke="#bacbd0" stroke-width="3" /><text x="48" y="876" class="small" >小刚：有利　小霞：互相抗水　马志士：不利</text><text x="48" y="908" class="body" >Lv7 泡沫 · Lv13 水枪</text><text x="48" y="936" class="small" >水系招式打小刚的两只宝可梦均为 4 倍。</text>
<text x="28" y="994" class="note" >原版像素素材 · 中文攻略标注 · 非游戏截图</text>
</svg>
