<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1224" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<title id="title">小刚攻略：先看属性，再选招式</title><desc id="desc">小刚使用12级小拳石和14级大岩蛇。水草四倍，钢格斗两倍，超能力等倍，电无效。猴怪两版均可获得。巴大蝶四倍弱岩石，使用念力有风险。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b7f88"/></marker></defs>
<style>.title{font-size:25px;font-weight:700;fill:#173740}.heading{font-size:22px;font-weight:700;fill:#173740}.body{font-size:20px;fill:#294752}.small{font-size:17px;fill:#526b75}.note{font-size:15px;fill:#526b75}.badge{font-size:17px;font-weight:700;fill:#fff}.number{font-size:20px;font-weight:700;fill:#fff}.value{font-size:24px;font-weight:700;fill:#173740}</style>
<rect x="1" y="1" width="718" height="1222" rx="12" fill="#f6f9f8" stroke="#d9e3e6"/><text x="28" y="42" class="title" >小刚攻略：先看属性，再选招式</text><text x="28" y="72" class="small" >对手等级为游戏数据；建议等级需结合个体、队友与道具</text>
<rect x="24" y="96" width="324" height="198" rx="12" fill="#f0ece3" stroke="#d9e3e6"/><rect x="364" y="96" width="332" height="198" rx="12" fill="#f0ece3" stroke="#d9e3e6"/><image x="28" y="110" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="164" y="144" class="heading" >小拳石</text><text x="164" y="180" class="value" >Lv12</text><text x="164" y="212" class="small" >岩石 / 地面</text><text x="48" y="272" class="body" >水 ×4 · 草 ×4 · 电 ×0</text><image x="368" y="110" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="504" y="144" class="heading" >大岩蛇</text><text x="504" y="180" class="value" >Lv14</text><text x="504" y="212" class="small" >岩石 / 地面</text><text x="388" y="272" class="body" >水 ×4 · 草 ×4 · 电 ×0</text><rect x="24" y="314" width="672" height="134" rx="12" fill="#eaf2ff" stroke="#d9e3e6"/><image x="24" y="326" width="112" height="112" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="148" y="346" class="heading" >杰尼龟</text><text x="394" y="346" class="body" >建议 Lv10–12</text><text x="148" y="384" class="body" >泡沫（水）· Lv7 学会</text><text x="148" y="420" class="small" >水系特殊攻击，打两只都是 4 倍。</text><rect x="24" y="462" width="672" height="134" rx="12" fill="#e9f5e8" stroke="#d9e3e6"/><image x="24" y="474" width="112" height="112" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="148" y="494" class="heading" >妙蛙种子</text><text x="394" y="494" class="body" >建议 Lv10–12</text><text x="148" y="532" class="body" >藤鞭（草）· Lv10 学会</text><text x="148" y="568" class="small" >草系特殊攻击，打两只都是 4 倍。</text><rect x="24" y="610" width="672" height="134" rx="12" fill="#fff0e5" stroke="#d9e3e6"/><image x="24" y="622" width="112" height="112" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="148" y="642" class="heading" >小火龙</text><text x="394" y="642" class="body" >建议 Lv14 以上</text><text x="148" y="680" class="body" >金属爪（钢）· Lv13 学会</text><text x="148" y="716" class="small" >2 倍，但对手物防高；要防岩石封。</text><rect x="24" y="758" width="672" height="134" rx="12" fill="#f3eee7" stroke="#d9e3e6"/><image x="24" y="770" width="112" height="112" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="148" y="790" class="heading" >猴怪</text><text x="394" y="790" class="body" >建议 Lv10–12</text><text x="148" y="828" class="body" >踢倒（格斗）· Lv6 学会</text><text x="148" y="864" class="small" >2 倍；大岩蛇 210 kg，招式威力 120。</text><rect x="24" y="906" width="672" height="134" rx="12" fill="#f0eafa" stroke="#d9e3e6"/><image x="24" y="918" width="112" height="112" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="148" y="938" class="heading" >巴大蝶</text><text x="394" y="938" class="body" >Lv10 进化后</text><text x="148" y="976" class="body" >念力（超能力）· Lv10 学会</text><text x="148" y="1012" class="small" >等倍，能打低特防；但自身 4 倍弱岩石。</text><rect x="24" y="1070" width="672" height="106" rx="12" fill="#fff6df" stroke="#d9e3e6"/><image x="24" y="1080" width="96" height="96" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="132" y="1106" class="heading" >皮卡丘的电系招式无效。</text><text x="132" y="1137" class="small" >建议等级是攻略建议，无法保证一击打倒或获胜。</text><text x="132" y="1163" class="small" >三代按属性分物理 / 特殊；带伤药并及时回复。</text>
<text x="28" y="1204" class="note" >原版像素素材 · 中文攻略标注 · 非游戏截图</text>
</svg>
