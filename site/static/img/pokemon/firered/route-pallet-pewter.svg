<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1244" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<title id="title">从真新镇到第一枚徽章</title><desc id="desc">原版关都地图标注真新镇、常青市和尼比市。主线通过1号道路、2号道路与常青森林，22号道路在常青市西侧，是可选支线。此图不用于森林内部逐格导航。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b7f88"/></marker></defs>
<style>.title{font-size:25px;font-weight:700;fill:#173740}.heading{font-size:22px;font-weight:700;fill:#173740}.body{font-size:20px;fill:#294752}.small{font-size:17px;fill:#526b75}.note{font-size:15px;fill:#526b75}.badge{font-size:17px;font-weight:700;fill:#fff}.number{font-size:20px;font-weight:700;fill:#fff}.value{font-size:24px;font-weight:700;fill:#173740}</style>
<rect x="1" y="1" width="718" height="1242" rx="12" fill="#f6f9f8" stroke="#d9e3e6"/><text x="28" y="42" class="title" >从真新镇到第一枚徽章</text><text x="28" y="72" class="small" >底图按游戏原始图块、布局和调色板还原；中文为攻略标注</text>
<rect x="24" y="96" width="672" height="470" rx="12" fill="#fff" stroke="#d9e3e6"/><svg x="60" y="112" width="600" height="432" viewBox="16 16 200 144"><image x="0" y="0" width="240" height="160" style="image-rendering:pixelated" href="data:image/png;base64,"/></svg><circle cx="216" cy="436" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M230 436 L270 437" fill="none" stroke="#fff" stroke-width="3" /><rect x="274" y="418" width="120" height="36" rx="12" fill="#173740" stroke="#173740"/><text x="286" y="444" class="badge" >真新镇</text><circle cx="216" cy="364" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M230 364 L270 365" fill="none" stroke="#fff" stroke-width="3" /><rect x="274" y="346" width="120" height="36" rx="12" fill="#173740" stroke="#173740"/><text x="286" y="372" class="badge" >常青市</text><circle cx="216" cy="268" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M230 268 L270 269" fill="none" stroke="#fff" stroke-width="3" /><rect x="274" y="250" width="120" height="36" rx="12" fill="#173740" stroke="#173740"/><text x="286" y="276" class="badge" >尼比市</text><text x="28" y="603" class="body" >主线向北走；常青市送包裹时要往返真新镇。</text><rect x="24" y="624" width="672" height="79" rx="12" fill="#fff" stroke="#d9e3e6"/><circle cx="54" cy="660" r="18" fill="#5e4a88"/><text x="54" y="667" class="number" text-anchor="middle">1</text><text x="88" y="655" class="heading" >真新镇</text><text x="88" y="684" class="small" >取伤药 → 选御三家 → 劲敌第一战</text><rect x="24" y="715" width="672" height="79" rx="12" fill="#fff" stroke="#d9e3e6"/><circle cx="54" cy="751" r="18" fill="#5e4a88"/><text x="54" y="758" class="number" text-anchor="middle">2</text><text x="88" y="746" class="heading" >1 号道路 → 常青市</text><text x="88" y="775" class="small" >商店领包裹 → 回研究所交给大木博士</text><rect x="24" y="806" width="672" height="79" rx="12" fill="#fff" stroke="#d9e3e6"/><circle cx="54" cy="842" r="18" fill="#5e4a88"/><text x="54" y="849" class="number" text-anchor="middle">3</text><text x="88" y="837" class="heading" >真新镇 → 常青市</text><text x="88" y="866" class="small" >拿图鉴与精灵球，再拿城镇地图后返回</text><rect x="24" y="897" width="672" height="79" rx="12" fill="#fff" stroke="#d9e3e6"/><circle cx="54" cy="933" r="18" fill="#5e4a88"/><text x="54" y="940" class="number" text-anchor="middle">4</text><text x="88" y="928" class="heading" >2 号道路 → 常青森林</text><text x="88" y="957" class="small" >捕捉队友；森林里有 5% 概率遇到皮卡丘</text><rect x="24" y="988" width="672" height="79" rx="12" fill="#fff" stroke="#d9e3e6"/><circle cx="54" cy="1024" r="18" fill="#5e4a88"/><text x="54" y="1031" class="number" text-anchor="middle">5</text><text x="88" y="1019" class="heading" >2 号道路北段 → 尼比市</text><text x="88" y="1048" class="small" >先到宝可梦中心回复，再挑战小刚</text><rect x="24" y="1096" width="672" height="100" rx="12" fill="#e9f5e8" stroke="#d9e3e6"/><image x="28" y="1108" width="80" height="80" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="120" y="1132" class="heading" >可选支线：常青市往西 → 22 号道路</text><text x="120" y="1165" class="small" >两版都能抓猴怪；也可能触发可选的劲敌战。</text>
<text x="28" y="1224" class="note" >原版像素素材 · 中文攻略标注 · 非游戏截图</text>
</svg>
