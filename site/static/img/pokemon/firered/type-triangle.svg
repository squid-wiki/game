<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 976" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<title id="title">草、火、水的克制关系</title><desc id="desc">草招式打杰尼龟两倍、水招式打小火龙两倍、火招式打妙蛙种子两倍。妙蛙种子实际为草毒双属性。劲敌选择与你相克的御三家，但开局招式均为一般属性。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b7f88"/></marker></defs>
<style>.title{font-size:25px;font-weight:700;fill:#173740}.heading{font-size:22px;font-weight:700;fill:#173740}.body{font-size:20px;fill:#294752}.small{font-size:17px;fill:#526b75}.note{font-size:15px;fill:#526b75}.badge{font-size:17px;font-weight:700;fill:#fff}.number{font-size:20px;font-weight:700;fill:#fff}.value{font-size:24px;font-weight:700;fill:#173740}</style>
<rect x="1" y="1" width="718" height="974" rx="12" fill="#f6f9f8" stroke="#d9e3e6"/><text x="28" y="42" class="title" >草、火、水的克制关系</text><text x="28" y="72" class="small" >伤害倍率按《火红 / 叶绿》的实际属性计算</text>
<rect x="24" y="96" width="672" height="432" rx="12" fill="#fff" stroke="#d9e3e6"/><image x="296" y="105" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="360" y="237" class="heading" text-anchor="middle">妙蛙种子</text><text x="360" y="263" class="small" text-anchor="middle">草 / 毒</text><image x="500" y="326" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="564" y="458" class="heading" text-anchor="middle">杰尼龟</text><text x="564" y="484" class="small" text-anchor="middle">水</text><image x="92" y="326" width="128" height="128" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="156" y="458" class="heading" text-anchor="middle">小火龙</text><text x="156" y="484" class="small" text-anchor="middle">火</text><path d="M428 245 L524 334" fill="none" stroke="#6b7f88" stroke-width="3" marker-end="url(#arrow)"/><text x="514" y="279" class="small" >草 → 水 ×2</text><path d="M496 405 L228 405" fill="none" stroke="#6b7f88" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="393" class="small" text-anchor="middle">水 → 火 ×2</text><path d="M194 334 L292 245" fill="none" stroke="#6b7f88" stroke-width="3" marker-end="url(#arrow)"/><text x="68" y="279" class="small" >火 → 草 ×2</text><text x="360" y="510" class="small" text-anchor="middle">箭头：使用该属性招式 → 受到克制的对手</text><rect x="24" y="548" width="672" height="276" rx="12" fill="#fff" stroke="#d9e3e6"/><text x="48" y="582" class="heading" >你选</text><text x="398" y="582" class="heading" >劲敌选</text><image x="42" y="590" width="64" height="64" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="116" y="629" class="body" >妙蛙种子</text><path d="M294 620 L366 620" fill="none" stroke="#6b7f88" stroke-width="3" marker-end="url(#arrow)"/><image x="388" y="590" width="64" height="64" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="466" y="629" class="body" >小火龙</text><image x="42" y="664" width="64" height="64" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="116" y="703" class="body" >小火龙</text><path d="M294 694 L366 694" fill="none" stroke="#6b7f88" stroke-width="3" marker-end="url(#arrow)"/><image x="388" y="664" width="64" height="64" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="466" y="703" class="body" >杰尼龟</text><image x="42" y="738" width="64" height="64" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="116" y="777" class="body" >杰尼龟</text><path d="M294 768 L366 768" fill="none" stroke="#6b7f88" stroke-width="3" marker-end="url(#arrow)"/><image x="388" y="738" width="64" height="64" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="466" y="777" class="body" >妙蛙种子</text><rect x="24" y="844" width="672" height="86" rx="12" fill="#fff6df" stroke="#d9e3e6"/><text x="44" y="879" class="body" >第一战双方 Lv5，只有一般系招式。</text><text x="44" y="907" class="small" >这时还用不上草、火、水的属性克制。</text>
<text x="28" y="956" class="note" >原版像素素材 · 中文攻略标注 · 非游戏截图</text>
</svg>
